<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0f1117"/>
  <!-- Glowing spiral loop -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <path d="M 120 256 C 120 160 190 110 270 110 C 370 110 410 180 410 260 C 410 350 330 400 240 400 C 160 400 130 340 150 280 C 170 220 230 200 270 210 C 320 220 330 270 310 300 C 290 330 250 330 240 310" 
        fill="none" 
        stroke="url(#grad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        filter="url(#glow)"/>
</svg>
